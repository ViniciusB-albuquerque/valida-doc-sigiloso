<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerificaJus Sigilo - Painel</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    const CHAVE_SESSAO = "verificajus_sessao";
    var SESSAO = null;
    try {
      const bruto = sessionStorage.getItem(CHAVE_SESSAO);
      if (!bruto) throw new Error("sem sessao");
      SESSAO = JSON.parse(bruto);
      if (!SESSAO || typeof SESSAO !== "object") throw new Error("sessao invalida");
    } catch (err) {
      window.location.href = "login.html";
    }
  </script>
</head>
<body>
  <div class="gs-federal-stripe"></div>

  <header class="gs-navbar">
    <div class="gs-navbar-container">
      <a href="painel.html" class="gs-brand">
        <div class="gs-brand-icon" title="Poder Judiciário">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="gs-brand-info">
          <h1>VerificaJus <span class="gs-tag-pill">Painel</span></h1>
          <p>Poder Judiciário &bull; Vara da Infância e da Juventude</p>
        </div>
      </a>

      <div class="gs-navbar-actions">
        <span class="gs-badge gs-badge-green"><span class="gs-badge-dot"></span> <span id="labelUsuario">Usuario conectado</span></span>
        <button id="btnSair" class="gs-btn gs-btn-secondary gs-btn-sm">Sair</button>
      </div>
    </div>
  </header>

  <main class="gs-main-container">
    <section class="gs-hero">
      <h2 class="gs-hero-title" id="boasVindas">Bem-vindo ao VerificaJus</h2>
      <p class="gs-hero-desc" id="descricaoPainel"></p>
      <div class="gs-hero-badges">
        <span class="gs-badge gs-badge-blue" id="badgePerfil">perfil</span>
      </div>
    </section>

    <div class="gs-grid-2col" id="cardsAcoes"></div>
  </main>

  <footer class="gs-footer">
    <div class="gs-footer-container">
      <div><strong>VerificaJus Sigilo</strong> &bull; Sistema judicial descentralizado</div>
      <div>Poder Judiciário &bull; República Federativa do Brasil</div>
    </div>
  </footer>

  <script>
    function card(iconeClasse, titulo, subtitulo, texto, href, label) {
      return `
        <div class="gs-card">
          <div class="gs-card-header">
            <div class="gs-card-header-main">
              <div class="gs-card-icon ${iconeClasse}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
              </div>
              <div class="gs-card-title">
                <h3>${titulo}</h3>
                <p>${subtitulo}</p>
              </div>
            </div>
          </div>
          <div class="gs-card-body">
            <p style="font-size:0.92rem; color:var(--gs-text-muted); line-height:1.6;">${texto}</p>
            <a href="${href}" class="gs-btn gs-btn-primary" style="margin-top:0.75rem; width:100%;">${label}</a>
          </div>
        </div>
      `;
    }

    document.getElementById("boasVindas").textContent = `Bem-vindo, ${SESSAO.nome}`;
    document.getElementById("labelUsuario").textContent = `${SESSAO.nome} - ${SESSAO.instituicao}`;
    document.getElementById("badgePerfil").textContent = `Perfil: ${SESSAO.perfil || "verificador"}`;

    if (SESSAO.perfil === "vara") {
      document.getElementById("descricaoPainel").textContent =
        "A Vara administra os documentos: emite, registra o hash, gera o código de validação, audita acessos, revoga e substitui documentos.";
      document.getElementById("cardsAcoes").innerHTML =
        card("icon-green", "Emitir documento", "Registro feito pela Vara", "Registre o hash do documento sigiloso, defina a validade e gere o código de validação.", "registrar.html", "Registrar documento") +
        card("icon-gold", "Gerenciar e auditar", "Revogação, substituição e histórico", "Busque documentos para auditar acessos, acompanhar substituições, revogar ou atualizar por uma nova versão.", "buscar.html", "Buscar documentos");
    } else {
      document.getElementById("descricaoPainel").textContent =
        "Este perfil valida documentos por código ou identificador e recebe apenas as informações autorizadas para sua classe.";
      document.getElementById("cardsAcoes").innerHTML =
        card("icon-green", "Validar pela câmera", "Leitura rápida do código", "Abra a câmera, leia o código e veja se o documento é válido. Ao assinar, o sistema mostra apenas seus campos permitidos.", "verificar.html", "Ler código") +
        card("icon-gold", "Validar por identificador", "Quando o código não estiver disponível", "Cole o documentId ou rótulo interno do documento para consultar o status e acessar os dados seletivos do seu perfil.", "verificar.html", "Informar documento");
    }

    document.getElementById("btnSair").onclick = () => {
      sessionStorage.removeItem(CHAVE_SESSAO);
      window.location.href = "login.html";
    };
  </script>
</body>
</html>
