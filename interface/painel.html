<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>VerificaJus Sigilo — Painel</title>
<script>
// Guarda de sessão — roda ANTES de o <body> renderizar. Se não houver uma
// sessão válida em sessionStorage, redireciona na hora para o login, de
// modo que a página nunca chega a aparecer vazia para quem não entrou.
const CHAVE_SESSAO = "verificajus_sessao";
var SESSAO = null;
try {
  const bruto = sessionStorage.getItem(CHAVE_SESSAO);
  if (!bruto) throw new Error("sem sessão");
  SESSAO = JSON.parse(bruto); // lança se não for JSON válido
  if (!SESSAO || typeof SESSAO !== "object") throw new Error("sessão inválida");
} catch (err) {
  window.location.href = "login";
}
</script>
<style>
  :root { color-scheme: light; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #1c1c1c;
    background: #fafafa;
  }
  h1 { font-size: 1.3rem; margin-bottom: 0; }
  p.subtitulo { color: #555; font-size: 0.9rem; margin-top: 0.3rem; }
  section {
    background: white;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  section h2 { font-size: 1rem; margin-top: 0; }
  label { display: block; font-size: 0.85rem; margin: 0.6rem 0 0.2rem; color: #444; }
  .cards { display: flex; gap: 1rem; flex-wrap: wrap; }
  .card {
    flex: 1 1 260px;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    padding: 0.9rem 1rem;
    background: #fafcff;
  }
  .card h3 { font-size: 0.95rem; margin: 0 0 0.3rem; }
  .card p { font-size: 0.82rem; color: #555; margin: 0 0 0.6rem; }
  a.botao, button {
    display: inline-block;
    margin-top: 0.8rem;
    padding: 0.55rem 1.1rem;
    border: none;
    border-radius: 6px;
    background: #1f2933;
    color: white;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: none;
  }
  button.secundario, a.botao.secundario { background: #52606d; }
  button:disabled,
  a.botao.desabilitado {
    background: #b0b7bd;
    cursor: not-allowed;
    pointer-events: none;
  }
  .resultado {
    margin-top: 0.8rem;
    padding: 0.7rem;
    background: #f4f6f7;
    border-radius: 6px;
    font-size: 0.82rem;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .aviso {
    background: #fff4e5;
    border: 1px solid #f0c36d;
    padding: 0.7rem 1rem;
    border-radius: 8px;
    font-size: 0.82rem;
    margin: 1rem 0 1.5rem;
  }
</style>
</head>
<body>

<h1>VerificaJus Sigilo — Painel</h1>
<p class="subtitulo" id="boasVindas"></p>

<section>
  <h2 id="tituloAcoes">O que você quer fazer?</h2>
  <div class="cards" id="cardsAcoes"></div>
</section>

<section>
  <h2>Sessão</h2>
  <button id="btnSair" class="secundario">Sair</button>
</section>

<script>
// Neste ponto SESSAO já foi validada pela guarda no <head> (senão a página
// já teria redirecionado). Só preenche o nome/instituição na tela.
document.getElementById("boasVindas").textContent =
  `Bem-vindo, ${SESSAO.nome} — ${SESSAO.instituicao}` +
  (SESSAO.perfil ? ` | perfil: ${SESSAO.perfil}` : "");

function card(titulo, texto, href, label) {
  return `
    <div class="card">
      <h3>${titulo}</h3>
      <p>${texto}</p>
      <a class="botao" href="${href}">${label}</a>
    </div>
  `;
}

if (SESSAO.perfil === "vara") {
  document.getElementById("tituloAcoes").textContent = "Painel administrativo da Vara";
  document.getElementById("cardsAcoes").innerHTML =
    card(
      "Emitir documento",
      "Registra hash e metadados de validade na blockchain e gera o QR Code dinamico.",
      "registrar",
      "Registrar documento"
    ) +
    card(
      "Gerenciar documentos",
      "Busca documentos para auditar, revogar ou substituir por uma nova versao.",
      "buscar",
      "Buscar e gerenciar"
    ) +
    card(
      "Auditar validacoes",
      "Consulta status, historico de acessos e cadeia de substituicoes.",
      "buscar",
      "Abrir auditoria"
    );
} else {
  document.getElementById("tituloAcoes").textContent = "Validacao por perfil";
  document.getElementById("cardsAcoes").innerHTML =
    card(
      "Validar por QR Code",
      "Abre a camera, le o QR e mostra se o documento e valido. Apos assinatura, exibe somente os dados permitidos ao seu perfil.",
      "verificar",
      "Ler QR ou validar"
    ) +
    card(
      "Validar por identificador",
      "Cole o codigo/documentId do documento quando nao estiver com o QR disponivel.",
      "verificar",
      "Informar documento"
    );
}

document.getElementById("btnSair").onclick = () => {
  sessionStorage.removeItem(CHAVE_SESSAO);
  window.location.href = "login";
};
</script>
</body>
</html>
