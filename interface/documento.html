<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>VerificaJus Sigilo — Documento</title>
<script src="https://unpkg.com/ethers@6/dist/ethers.umd.min.js" type="application/javascript"></script>
<script src="util.js"></script>
<script>
const CHAVE_SESSAO = "verificajus_sessao";
var SESSAO = null;
try {
  const bruto = sessionStorage.getItem(CHAVE_SESSAO);
  SESSAO = bruto ? JSON.parse(bruto) : null;
  if (!SESSAO || typeof SESSAO !== "object") {
    window.location.href = "login";
  }
  if (SESSAO.perfil !== "vara") {
    const params = new URLSearchParams(window.location.search);
    window.location.href = "verificar" + (params.get("id") ? `?id=${encodeURIComponent(params.get("id"))}` : "");
  }
} catch (err) {
  window.location.href = "login";
}
</script>
<style>
  :root { color-scheme: light; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 780px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #1c1c1c;
    background: #fafafa;
  }
  h1 { font-size: 1.3rem; margin-bottom: 0; }
  p.subtitulo { color: #555; font-size: 0.9rem; margin-top: 0.3rem; }
  .aviso {
    background: #fff4e5;
    border: 1px solid #f0c36d;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    margin: 1rem 0 1.5rem;
  }
  section {
    background: white;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  section h2 { font-size: 1rem; margin-top: 0; }
  label { display: block; font-size: 0.85rem; margin: 0.6rem 0 0.2rem; color: #444; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.45rem 0.6rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  button {
    margin-top: 0.8rem;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    background: #1f2933;
    color: white;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button.secundario { background: #52606d; }
  button.perigo { background: #a12b2b; }
  button:disabled { background: #b0b7bd; cursor: not-allowed; }
  .resultado {
    margin-top: 0.8rem;
    padding: 0.7rem;
    background: #f4f6f7;
    border-radius: 6px;
    font-size: 0.82rem;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .status-pill {
    display: inline-block;
    padding: 0.15rem 0.7rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .status-Valido { background: #d7f5df; color: #1a7a3d; }
  .status-Expirado { background: #f5e9d7; color: #8a5b1a; }
  .status-Revogado { background: #f7d9d9; color: #a12b2b; }
  .status-Substituido { background: #dde3f7; color: #2b3ea1; }
  #contaAtual, #papelUsuario { font-size: 0.82rem; color: #444; }
  a.link-voltar { font-size: 0.85rem; color: #1f2933; }
  #secGerenciar { opacity: 0.5; }
  #secGerenciar.habilitada { opacity: 1; }
</style>
</head>
<body>

<a class="link-voltar" href="buscar">← Voltar à busca</a>
<h1>VerificaJus Sigilo — Documento</h1>
<p class="subtitulo" id="idAtual"></p>

<div class="aviso">
  Ferramenta de <strong>desenvolvimento/teste</strong>. Esta tela e exclusiva da Vara:
  permite auditar, revogar e substituir documentos. Demais perfis usam a validacao seletiva.
</div>

<section>
  <h2>Conexão</h2>
  <button id="btnConectar">Conectar MetaMask</button>
  <div id="contaAtual" class="resultado" style="display:none;"></div>

  <label for="inputEndereco">Endereço do contrato</label>
  <input id="inputEndereco" placeholder="0x..." />
  <button id="btnCarregar" class="secundario">Carregar contrato</button>
  <div id="papelUsuario" class="resultado" style="display:none;"></div>
</section>

<section id="secDetalhes" style="display:none;">
  <h2>Detalhes</h2>
  <div id="statusPill"></div>
  <div id="resultadoDetalhes" class="resultado"></div>
  <button id="btnVerAtual" class="secundario" style="display:none;">Ver documento atual</button>
</section>

<section id="secGerenciar" style="display:none;">
  <h2>Gerenciar (só a Vara)</h2>

  <div>
    <button id="btnRevogar" class="perigo">Revogar este documento</button>
    <div id="resultadoRevogar" class="resultado" style="display:none;"></div>
  </div>

  <hr style="margin:1.2rem 0; border:none; border-top:1px solid #e2e2e2;" />

  <h2 style="font-size:0.95rem;">Substituir por uma nova versão</h2>
  <label for="novoRotulo">Identificador interno do novo documento</label>
  <input id="novoRotulo" placeholder="alvara-viagem-0001-v2" />
  <label for="novoArquivo">Novo documento (PDF)</label>
  <input id="novoArquivo" type="file" accept="application/pdf" />
  <div id="novoHashPreview" class="resultado" style="display:none;"></div>
  <div id="avisoHashDuplicadoSub" class="aviso" style="display:none;"></div>
  <label for="novoExpira">Expira em (opcional)</label>
  <input id="novoExpira" type="datetime-local" />
  <button id="btnSubstituir">Substituir</button>
  <div id="resultadoSubstituir" class="resultado" style="display:none;"></div>
</section>

<script>
const ABI = [
  "function vara() view returns (address)",
  "function obterRegistro(bytes32 documentId) view returns (bytes32 documentHash, address emissor, uint64 emitidoEm, uint64 expiraEm, uint8 status, bytes32 substituidoPor)",
  "function resolverDocumentoAtual(bytes32 documentId) view returns (bytes32 documentIdAtual)",
  "function consultarPorHash(bytes32 documentHash) view returns (bool existe, bytes32 documentId)",
  "function revogarDocumento(bytes32 documentId)",
  "function substituirDocumento(bytes32 documentIdAntigo, bytes32 documentIdNovo, bytes32 documentHashNovo, uint64 expiraEmNovo)",
];

const STATUS_NOMES = ["Valido", "Expirado", "Revogado", "Substituido"];
const CHAIN_ID_ESPERADO = 1337n;

let provider, signer, contrato;
let isVara = false;
let documentIdAtual = null;

if (window.ethereum) {
  window.ethereum.on("accountsChanged", () => window.location.reload());
  window.ethereum.on("chainChanged", () => window.location.reload());
}

const params = new URLSearchParams(window.location.search);
const idBruto = params.get("id") || "";

carregarConfigBackend()
  .then((config) => {
    document.getElementById("inputEndereco").value = config.contratoEndereco;
  })
  .catch((err) => console.warn("Nao foi possivel carregar config do backend:", err));

async function hashArquivo(file) {
  const buffer = await file.arrayBuffer();
  return ethers.keccak256(new Uint8Array(buffer));
}

function mostrar(id, texto) {
  const el = document.getElementById(id);
  el.style.display = "block";
  el.textContent = texto;
}

function decodificarErro(err, contratoRef) {
  const data = err?.data ?? err?.info?.error?.data;
  if (data && contratoRef) {
    try {
      const decoded = contratoRef.interface.parseError(data);
      return `${decoded.name}(${decoded.args.map(String).join(", ")})`;
    } catch (_) {}
  }
  return err?.reason || err?.shortMessage || err?.message || String(err);
}

async function trocarParaRedeLocal() {
  const CHAIN_ID_HEX = "0x539";
  try {
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN_ID_HEX }] });
  } catch (switchError) {
    if (switchError.code === 4902) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: CHAIN_ID_HEX,
          chainName: "Hardhat Local",
          rpcUrls: ["http://127.0.0.1:8545"],
          nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
        }],
      });
    } else {
      throw switchError;
    }
  }
}

if (!idBruto) {
  document.getElementById("idAtual").textContent = "Nenhum documento informado na URL (?id=...).";
} else {
  documentIdAtual = resolverIdentificadorDocumento(idBruto);
  document.getElementById("idAtual").textContent = `documentId: ${documentIdAtual}`;
}

document.getElementById("btnConectar").onclick = async () => {
  if (!window.ethereum) {
    alert("MetaMask não encontrado. Instale a extensão para continuar.");
    return;
  }
  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);

  const rede = await provider.getNetwork();
  const el = document.getElementById("contaAtual");

  if (rede.chainId !== CHAIN_ID_ESPERADO) {
    el.style.display = "block";
    el.style.background = "#fff4e5";
    el.textContent = `Rede atual (chainId ${rede.chainId}) é diferente da esperada (${CHAIN_ID_ESPERADO}).\nPedindo ao MetaMask para trocar — aprove o popup...`;
    try {
      await trocarParaRedeLocal();
      return;
    } catch (err) {
      el.style.background = "#f7d9d9";
      el.textContent = `Não foi possível trocar automaticamente de rede: ${err?.message || err}`;
      return;
    }
  }

  signer = await provider.getSigner();
  el.style.display = "block";
  el.style.background = "";
  el.textContent = `Conectado: ${await signer.getAddress()}`;
};

async function carregarDetalhes() {
  if (!contrato || !documentIdAtual) return;

  try {
    const r = await contrato.obterRegistro(documentIdAtual);
    const nomeStatus = STATUS_NOMES[Number(r.status)];

    document.getElementById("secDetalhes").style.display = "block";
    document.getElementById("statusPill").innerHTML = `<span class="status-pill status-${nomeStatus}">${nomeStatus}</span>`;
    mostrar(
      "resultadoDetalhes",
      `documentHash: ${r.documentHash}\n` +
      `emissor: ${r.emissor}\n` +
      `emitidoEm: ${new Date(Number(r.emitidoEm) * 1000).toLocaleString()}\n` +
      `expiraEm: ${r.expiraEm == 0n ? "sem expiração" : new Date(Number(r.expiraEm) * 1000).toLocaleString()}\n` +
      `substituidoPor: ${r.substituidoPor === ethers.ZeroHash ? "-" : r.substituidoPor}`
    );

    const btnVerAtual = document.getElementById("btnVerAtual");
    btnVerAtual.style.display = nomeStatus === "Substituido" ? "inline-block" : "none";

    const secGerenciar = document.getElementById("secGerenciar");
    secGerenciar.style.display = "block";
    const podeGerenciar = isVara && nomeStatus === "Valido";
    secGerenciar.classList.toggle("habilitada", podeGerenciar);
    secGerenciar.querySelectorAll("input, button").forEach((el) => (el.disabled = !podeGerenciar));
  } catch (err) {
    document.getElementById("secDetalhes").style.display = "block";
    mostrar("resultadoDetalhes", "Erro ao carregar: " + decodificarErro(err, contrato));
  }
}

document.getElementById("btnCarregar").onclick = async () => {
  const endereco = document.getElementById("inputEndereco").value.trim();
  if (!ethers.isAddress(endereco)) return alert("Endereço de contrato inválido.");
  if (!signer) return alert("Conecte o MetaMask primeiro.");
  if (!documentIdAtual) return alert("Nenhum documentId na URL — volte pra busca.");

  contrato = new ethers.Contract(endereco, ABI, signer);

  const enderecoVara = await contrato.vara();
  const enderecoConectado = await signer.getAddress();
  isVara = enderecoConectado.toLowerCase() === enderecoVara.toLowerCase();

  const el = document.getElementById("papelUsuario");
  el.style.display = "block";
  el.textContent = isVara
    ? `Você é a Vara — pode gerenciar este documento.`
    : `Você não é a Vara — pode ver os detalhes, mas não pode revogar/substituir.`;

  await carregarDetalhes();
};

document.getElementById("btnVerAtual").onclick = async () => {
  try {
    const idResolvido = await contrato.resolverDocumentoAtual(documentIdAtual);
    documentIdAtual = idResolvido;
    document.getElementById("idAtual").textContent = `documentId: ${documentIdAtual}`;
    await carregarDetalhes();
  } catch (err) {
    mostrar("resultadoDetalhes", "Erro: " + decodificarErro(err, contrato));
  }
};

document.getElementById("btnRevogar").onclick = async () => {
  if (!contrato) return;
  try {
    const tx = await contrato.revogarDocumento(documentIdAtual);
    mostrar("resultadoRevogar", `Transação enviada: ${tx.hash}\nAguardando confirmação...`);
    const receipt = await tx.wait();
    mostrar("resultadoRevogar", `Confirmado no bloco ${receipt.blockNumber}\ntx: ${receipt.hash}`);
    await carregarDetalhes();
  } catch (err) {
    mostrar("resultadoRevogar", "Erro: " + decodificarErro(err, contrato));
  }
};

document.getElementById("novoArquivo").addEventListener("change", async (ev) => {
  const file = ev.target.files[0];
  const el = document.getElementById("novoHashPreview");
  const avisoEl = document.getElementById("avisoHashDuplicadoSub");
  const btnSubstituir = document.getElementById("btnSubstituir");

  avisoEl.style.display = "none";

  if (!file) { el.style.display = "none"; return; }

  const hash = await hashArquivo(file);
  el.style.display = "block";
  el.textContent = `Arquivo: ${file.name} (${file.size} bytes)\ndocumentHash calculado: ${hash}`;

  if (!contrato) return;

  try {
    const [existe, documentIdExistente] = await contrato.consultarPorHash(hash);
    if (existe) {
      const linkVerificar = new URL("verificar", window.location.href);
      linkVerificar.searchParams.set("id", documentIdExistente);
      avisoEl.style.display = "block";
      avisoEl.innerHTML =
        `Este conteúdo já foi registrado em outro documento.<br/>` +
        `<a href="${linkVerificar.toString()}" target="_blank">Ver documento existente</a>`;
      btnSubstituir.disabled = true;
    }
  } catch (err) {
    console.warn("Não foi possível checar duplicata por hash:", err);
  }
});

document.getElementById("btnSubstituir").onclick = async () => {
  if (!contrato) return;
  const rotulo = document.getElementById("novoRotulo").value;
  const arquivo = document.getElementById("novoArquivo").files[0];
  const expiraStr = document.getElementById("novoExpira").value;
  if (!rotulo || !arquivo) return alert("Preencha o identificador e escolha o arquivo do novo documento.");

  const idNovo = resolverIdentificadorDocumento(rotulo);
  const hashNovo = await hashArquivo(arquivo);
  const expiraEm = expiraStr ? Math.floor(new Date(expiraStr).getTime() / 1000) : 0;

  try {
    const tx = await contrato.substituirDocumento(documentIdAtual, idNovo, hashNovo, expiraEm);
    mostrar("resultadoSubstituir", `Transação enviada: ${tx.hash}\nAguardando confirmação...`);
    const receipt = await tx.wait();
    mostrar(
      "resultadoSubstituir",
      `Confirmado no bloco ${receipt.blockNumber}\ntx: ${receipt.hash}\nnovo documentId: ${idNovo}`
    );
    await carregarDetalhes();
  } catch (err) {
    mostrar("resultadoSubstituir", "Erro: " + decodificarErro(err, contrato));
  }
};
</script>
</body>
</html>
